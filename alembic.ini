[alembic]
script_location = alembic
# URL comes from DATABASE_URL via alembic/env.py; this is a fallback only.
sqlalchemy.url = postgresql+psycopg://blunderless:blunderless@localhost:5432/blunderless

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
